<div class="diagnostic-section">
  <h2>Liste des capteurs HSE</h2>
  <input type="text" id="sensor-search" placeholder="Rechercher par nom, unité...">
  <button id="export-sensors-csv">Exporter CSV</button>
  <table class="sensors-table">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Unit</th>
        <th>État</th>
        <th>Valeur</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="sensors-tbody"></tbody>
  </table>
  <div id="sensor-details"></div>
</div>
