<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Home Suivi Élec</title>
<style>
.integration-block { border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; }
.sensor { margin-left: 10px; }
.tab-content { display: none; }
.tab-content.active { display: block; }
button { margin-right: 5px; margin-bottom: 5px; }
</style>
</head>
<body>
<h1>⚡ Home Suivi Élec</h1>
<div id="tabs">
  <button onclick="showTab('detection')">Détection</button>
  <button onclick="showTab('configuration')">Configuration</button>
  <button onclick="showTab('customisation')">Customisation</button>
  <button onclick="showTab('generation')">Génération cartes</button>
</div>

<div id="detection" class="tab-content active">
  <p>Total capteurs détectés: <span id="total">-</span></p>
  <p>Dernière mise à jour: <span id="lastRefresh">-</span></p>
  <button id="refresh">🔄 Rafraîchir</button>
  <div id="content"></div>
</div>

<div id="configuration" class="tab-content">
  <p>Configurez vos capteurs :</p>
  <div id="content"></div>
</div>

<div id="customisation" class="tab-content">
  <p>Options de personnalisation de l'interface (à implémenter)</p>
</div>

<div id="generation" class="tab-content">
  <p>Génération automatique des cartes Lovelace (à implémenter)</p>
</div>

<script src="app.js"></script>
<script>
function showTab(tab) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
}
</script>
</body>
</html>
