<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Home Suivi Élec</title>
<style>
body.hs_body { font-family: Arial; margin:2rem; color:var(--primary-text-color); background:var(--card-background-color);}
.hs_status { padding:1rem; border-radius:12px; background:var(--ha-card-background,#fff); box-shadow:0 2px 6px rgba(0,0,0,.1); margin-bottom:1rem;}
.hs_status button { padding:.5rem 1rem; margin-right:.5rem; background:var(--primary-color); color:white; border:none; border-radius:8px; cursor:pointer;}
.hs_status button:hover{opacity:.9;}
.hs_message{margin-top:1rem; font-style:italic; color:var(--secondary-text-color);}
.hs_integration_block{padding:.5rem; margin-bottom:.5rem; border:1px solid #ccc; border-radius:6px; background:white;}
</style>
</head>
<body class="hs_body">
<h1>⚡ Home Suivi Élec</h1>
<div class="hs_status">
  <button id="load-btn">🔄 Charger capteurs</button>
  <button id="save-btn">💾 Sauvegarder</button>
  <div id="message" class="hs_message"></div>
</div>
<div id="integration-list"></div>

<script>
const token = "<VOTRE_LONG_LIVED_TOKEN>"; // Remplacer par token HA
const headers = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };

const container = document.getElementById("integration-list");
const message = document.getElementById("message");

async function loadSensors(){
    message.textContent="Chargement...";
    try{
        const r = await fetch("/api/home_suivi_elec/get_sensors", {headers});
        const data = await r.json();
        container.innerHTML="";
        Object.entries(data).forEach(([integ, sensors])=>{
            const block=document.createElement("div");
            block.className="hs_integration_block";
            const header=document.createElement("div");
            header.innerHTML=`<strong>${integ}</strong>`;
            block.appendChild(header);
            sensors.forEach(s=>{
                const item=document.createElement("div");
                item.innerHTML=`<label><input type="checkbox" data-integration="${integ}" value="${s.entity_id}" checked> ${s.friendly_name||s.entity_id}</label>`;
                block.appendChild(item);
            });
            container.appendChild(block);
        });
        message.textContent="✅ Capteurs chargés";
    }catch(e){message.textContent="❌ "+e.message;}
}

async function saveSelection(){
    message.textContent="Sauvegarde...";
    const selections={};
    document.querySelectorAll("input[type=checkbox]").forEach(cb=>{
        const integ=cb.dataset.integration;
        if(!selections[integ]) selections[integ]=[];
        selections[integ].push({entity_id:cb.value,enabled:cb.checked});
    });
    try{
        await fetch("/api/home_suivi_elec/save_selection",{method:"POST",headers,body:JSON.stringify(selections)});
        message.textContent="✅ Sauvegardé";
    }catch(e){message.textContent="❌ "+e.message;}
}

document.getElementById("load-btn").addEventListener("click",loadSensors);
document.getElementById("save-btn").addEventListener("click",saveSelection);
</script>
</body>
</html>
