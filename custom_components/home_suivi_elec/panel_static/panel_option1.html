<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Home Suivi Élec</title>
  <script type="module" src="/local/community/home_suivi_elec_panel/panel.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; color: var(--primary-text-color); background: var(--card-background-color); }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .subtitle { color: var(--secondary-text-color); margin-bottom: 1rem; }
    .status { background: var(--ha-card-background, #fff); padding: 1rem; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
    button { padding: 0.5rem 1rem; margin-right: 0.5rem; background: var(--primary-color); color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .integration-block { border: 1px solid #ccc; border-radius: 8px; padding: 0.8rem; margin-bottom: 1rem; background: white; }
    .integration-header { display: flex; justify-content: space-between; align-items: center; background: #f0f0f0; padding: 0.3rem 0.8rem; border-radius: 6px; font-weight: bold; }
    .sensor-list { margin-top: 0.5rem; padding-left: 1rem; }
    .message { margin-top: 1rem; color: var(--secondary-text-color); font-style: italic; }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>⚡ Home Suivi Élec</h1>
    <div class="subtitle">Interface de sélection des capteurs</div>
    <div class="status">
      <button id="load-btn">🔄 Charger les capteurs</button>
      <button id="save-btn">💾 Sauvegarder la sélection</button>
      <div id="message" class="message"></div>
    </div>
    <div id="integration-list"></div>
  </div>
</body>
</html>
